<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>彩狩り：赤</title>
<meta name="description" content="青森の色を、狩りに行く。一色だけを集めて、つなげた写真です。">
<meta property="og:title" content="彩狩り：赤">
<meta property="og:description" content="青森の色を、狩りに行く。一色だけを集めて、つなげた写真です。">
<meta property="og:type" content="website">
<meta property="og:url" content="https://demi-04.github.io/aomori-photos/red.html">
<meta property="og:image" content="https://demi-04.github.io/aomori-photos/red.jpg">
<style>
  :root { --accent: #c8102e; --bg: #f5f5f3; --ink: #222; --sub: #666; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  main { max-width: 1080px; margin: 0 auto; }
  header {
    padding: calc(40px + env(safe-area-inset-top, 0px)) 24px 32px;
    text-align: center;
  }
  h1 {
    margin: 0 0 20px;
    font-size: clamp(28px, 7vw, 44px);
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  h1 .color { color: var(--accent); }
  rt { font-size: 0.35em; letter-spacing: 0.1em; color: var(--sub); }
  .lead { margin: 0; font-size: 16px; line-height: 2; }
  .rule { width: 48px; height: 3px; background: var(--accent); margin: 28px auto 0; border: 0; }
  img { display: block; width: 100%; height: auto; }
  nav {
    display: flex; justify-content: center; gap: 32px;
    padding: 32px 24px 48px; font-size: 18px;
  }
  nav a { color: var(--sub); text-decoration: none; padding: 4px 8px; }
  nav a[aria-current="page"] { color: var(--ink); border-bottom: 2px solid var(--accent); }
  nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1><ruby>彩狩り<rt>いろがり</rt></ruby>：<span class="color">赤</span></h1>
    <p class="lead">青森の色を、狩りに行く。<br>一色だけを集めて、つなげた写真です。</p>
    <hr class="rule">
  </header>
  <img src="red.jpg" width="1080" height="5400" alt="彩狩り：赤　青森で見つけた赤色の写真">
  <nav aria-label="ほかの色">
    <a href="red.html" aria-current="page">赤</a>
    <a href="blue.html">青</a>
    <a href="silver.html">銀</a>
  </nav>
</main>
</body>
</html>
